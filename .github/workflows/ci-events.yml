name: CI events

# One strict `ci_run_completed` line per finished run of the workflows below, whatever its conclusion
# (cancelled and early failures included), and one strict `branch_deleted` line per deleted branch,
# posted by the Fleet Ops bot to the fleet's CI channel. They are only the fleet's fast wake-up path:
# GitHub stays the source of truth, and the fleet's deadlines catch a lost line. The grammar is shared
# with the fleet's parser — change both together.
on:
  # A branch deleted with no PR on it ends the fleet's PR entity for it without waking its owner
  # (fleet ADR-083 am. 15); the webapp's copy is the same.
  delete:
  workflow_run:
    workflows: [CI, CI Frontend, Main]
    types: [completed]

permissions: {}

jobs:
  ci-line:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Event fields reach the line through JS, never through a `run:` script: a branch name is
      # attacker-controlled on a public repo.
      - name: Build the ci_run_completed line
        id: line
        uses: actions/github-script@v9
        env:
          CHANNEL: ${{ vars.FLEET_CI_CHANNEL_ID }}
        with:
          script: |
            // RFC 3986 unreserved characters and `/` stay, every other UTF-8 byte becomes %XX — byte for byte
            // what the fleet's own formatter writes, so a parsed line re-formats to itself.
            const enc = (v) =>
              encodeURIComponent(String(v))
                .replace(/[!'()*]/g, (c) => `%${c.charCodeAt(0).toString(16).toUpperCase()}`)
                .replaceAll('%2F', '/');
            const run = context.payload.workflow_run;
            // A `run-name` replaces the run's own `name`, so the workflow's name comes from `workflow`.
            const workflow = context.payload.workflow?.name ?? run.name;
            const prs = (run.pull_requests ?? []).map((pr) => pr.number);
            const conclusion = run.conclusion || 'none';
            const line = [
              'ci_run_completed',
              `repo=${enc(run.repository.full_name)}`,
              `run_id=${enc(run.id)}`,
              `workflow=${enc(workflow)}`,
              `event=${enc(run.event)}`,
              `branch=${run.head_branch ? enc(run.head_branch) : '-'}`,
              `sha=${enc(run.head_sha)}`,
              `prs=${prs.length > 0 ? prs.join(',') : '-'}`,
              `conclusion=${enc(conclusion)}`,
              // A rerun's completion is otherwise byte-identical to the original run's line.
              `attempt=${run.run_attempt}`,
            ].join(' ');
            const channel = process.env.CHANNEL;
            if (!channel) {
              core.setFailed('the repo variable FLEET_CI_CHANNEL_ID is not set');
              return;
            }
            // Slack drops metadata whose event_type is not snake_case (a dot is refused).
            const metadata = {
              event_type: 'pickypaws_ci_run_completed',
              event_payload: {
                run_id: run.id,
                workflow,
                head_sha: run.head_sha,
                head_branch: run.head_branch ?? '',
                pr_numbers: prs,
                conclusion,
                event: run.event,
              },
            };
            core.info(line);
            core.setOutput(
              'payload',
              JSON.stringify({ channel, text: line, mrkdwn: false, unfurl_links: false, unfurl_media: false, metadata }),
            );

      - name: Post it as the Fleet Ops bot
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.postMessage
          token: ${{ secrets.FLEET_OPS_SLACK_BOT_TOKEN }}
          errors: true
          payload: ${{ steps.line.outputs.payload }}

  # A tag's deletion posts nothing.
  branch-line:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Event fields reach the line through JS, never through a `run:` script: a branch name is
      # attacker-controlled on a public repo.
      - name: Build the branch_deleted line
        id: line
        uses: actions/github-script@v9
        env:
          CHANNEL: ${{ vars.FLEET_CI_CHANNEL_ID }}
        with:
          script: |
            // The `ci_run_completed` line's encoder, byte for byte: the fleet parses both with one grammar.
            const enc = (v) =>
              encodeURIComponent(String(v))
                .replace(/[!'()*]/g, (c) => `%${c.charCodeAt(0).toString(16).toUpperCase()}`)
                .replaceAll('%2F', '/');
            const repo = context.payload.repository.full_name;
            // `delete` names the short ref; a full one is reduced to it.
            const branch = String(context.payload.ref ?? '').replace(/^refs\/heads\//, '');
            if (context.payload.ref_type !== 'branch' || branch === '') {
              core.info(`not a branch deletion (ref_type=${context.payload.ref_type}): nothing to post`);
              return;
            }
            const line = ['branch_deleted', `repo=${enc(repo)}`, `branch=${enc(branch)}`].join(' ');
            const channel = process.env.CHANNEL;
            if (!channel) {
              core.setFailed('the repo variable FLEET_CI_CHANNEL_ID is not set');
              return;
            }
            // Slack drops metadata whose event_type is not snake_case (a dot is refused).
            const metadata = { event_type: 'pickypaws_branch_deleted', event_payload: { repo, branch } };
            core.info(line);
            core.setOutput(
              'payload',
              JSON.stringify({ channel, text: line, mrkdwn: false, unfurl_links: false, unfurl_media: false, metadata }),
            );

      - name: Post it as the Fleet Ops bot
        if: steps.line.outputs.payload != ''
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.postMessage
          token: ${{ secrets.FLEET_OPS_SLACK_BOT_TOKEN }}
          errors: true
          payload: ${{ steps.line.outputs.payload }}
